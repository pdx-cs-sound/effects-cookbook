<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="Spectra of the square and sawtooth">
<title>Spectra of the square and sawtooth</title>
<desc>Amplitude of each harmonic of a 100 Hz square and sawtooth, measured with the probe on this page. The sawtooth carries every harmonic and the square only the odd ones, and both sets fall off as one over the harmonic number.</desc>

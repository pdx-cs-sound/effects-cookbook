<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="Resampling: the spectrum scales by the ratio">
<title>Resampling: the spectrum scales by the ratio</title>
<desc>Measured harmonics of a 200 Hz sawtooth before and after resampling at ratio 1.5. Every harmonic moves to 1.5 times its frequency; the spacing scales with the fundamental, so the sound is higher, not just brighter.</desc>
<g stroke="#888780" stroke-opacity="0.25" stroke-width="1">
<line x1="46.0" y1="286" x2="46.0" y2="14"/>
<line x1="138.0" y1="286" x2="138.0" y2="14"/>
<line x1="230.0" y1="286" x2="230.0" y2="14"/>
<line x1="322.0" y1="286" x2="322.0" y2="14"/>
<line x1="414.0" y1="286" x2="414.0" y2="14"/>
<line x1="506.0" y1="286" x2="506.0" y2="14"/>
<line x1="46" y1="286.0" x2="506" y2="286.0"/>
<line x1="46" y1="218.0" x2="506" y2="218.0"/>
<line x1="46" y1="150.0" x2="506" y2="150.0"/>
<line x1="46" y1="82.0" x2="506" y2="82.0"/>
<line x1="46" y1="14.0" x2="506" y2="14.0"/>
</g>
<g fill="#888780" font-size="11" font-family="system-ui, sans-serif">
<text x="46.0" y="302" text-anchor="middle">0</text>
<text x="138.0" y="302" text-anchor="middle">400</text>
<text x="230.0" y="302" text-anchor="middle">800</text>
<text x="322.0" y="302" text-anchor="middle">1200</text>
<text x="414.0" y="302" text-anchor="middle">1600</text>
<text x="506.0" y="302" text-anchor="middle">2000</text>
<text x="40" y="289.0" text-anchor="end">0.0</text>
<text x="40" y="221.0" text-anchor="end">0.2</text>
<text x="40" y="153.0" text-anchor="end">0.4</text>
<text x="40" y="85.0" text-anchor="end">0.6</text>
<text x="40" y="17.0" text-anchor="end">0.8</text>
<text x="276.0" y="316" text-anchor="middle">frequency (Hz)</text>
<text x="13" y="150.0" text-anchor="middle" transform="rotate(-90 13 150.0)">amplitude (linear)</text>
</g>
<polyline points="90.6,286.0 90.6,69.3" fill="none" stroke="#378add" stroke-width="2.6"/>
<polyline points="116.4,286.0 116.4,69.6" fill="none" stroke="#1baf7a" stroke-width="2.6"/>

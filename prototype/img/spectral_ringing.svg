<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-label="Ringing: a spectral lowpass against a Chapter 9 biquad">
<title>Ringing: a spectral lowpass against a Chapter 9 biquad</title>
<desc>One click through two 1000 Hz lowpass filters, drawn against time either side of the click. The spectral filter's response is symmetric about the click, so half of its ringing arrives before the transient that caused it. The biquad is silent until the click and settles about a millisecond after it.</desc>
